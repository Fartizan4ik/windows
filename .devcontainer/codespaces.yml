services:
  windows:
    container_name: windows
    image: ghcr.io/dockur/windows
    environment:
      VERSION: "https://pixeldrain.com/api/file/heAHxLqj?download"
      RAM_SIZE: "6G"
      BALLOONING: "Y"
      CPU_CORES: "4"
      DISK_SIZE: "max"
      DISK_MINIMUM: "1G"
      USERNAME: "vps"
      PASSWORD: "vps"
      HOST: "vps"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows:/storage
      - ./start.sh:/run/start.sh:ro
    restart: on-failure
    stop_grace_period: 2m
